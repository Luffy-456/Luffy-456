name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Added explicit permissions block for safety
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3 # Updated to v3 for better stability

      - uses: Platane/snk@v3 # Updated to v3 (latest)
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }} # Dynamically uses your username
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
